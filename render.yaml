services:
  - type: web
    name: fairmeet
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn fairmeet.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.5
      - key: FAIRMEET_DB_PATH
        value: /tmp/fairmeet.db
      - key: FAIRMEET_GEO
        value: fake
      - key: FAIRMEET_DEMO
        value: "1"
      - key: FAIRMEET_DEMO_ACCESS_CODE
        sync: false
      - key: FAIRMEET_DEMO_SESSION_SECRET
        generateValue: true
      - key: FAIRMEET_DEMO_SECURE_COOKIE
        value: "1"
      - key: FAIRMEET_DEMO_AI_DAILY_LIMIT
        value: "100"
