{% extends "base.html" %}
{% block title %}加入旅程 · {{ trip.title }}{% endblock %}
{% block content %}
<h1>加入「{{ trip.title }}」</h1>
<p class="hint">目的地：{{ trip.destination }}{% if trip.start_date %} · {{ trip.start_date }} 至 {{ trip.end_date }}{% endif %}</p>

<form class="card" method="post" action="/join/{{ trip.invite_token }}">
  <label>你的昵称
    <input name="display_name" required maxlength="60" placeholder="例如：小林">
  </label>
  <button type="submit">加入这趟旅程</button>
</form>
<p class="hint">凭此邀请链接即可加入并填写需求、贡献灵感。阶段 B 为本机演示，链接暂不等同于正式账户认证。</p>
{% endblock %}
